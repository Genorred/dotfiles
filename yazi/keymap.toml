# run  = "cd ~/Downloads"
# desc = "Cd to ~/Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Pictures"
desc = "Cd to ~/Pictures"

[[mgr.prepend_keymap]]
on   = [ "g", "P" ]
run  = "cd ~/Projects/"
desc = "Cd to ~/Projects/"

[[mgr.prepend_keymap]]
on = "<C-y>"
run = ["plugin wl-clipboard"]

[[mgr.prepend_keymap]]
on   = [ "<C-s>" ]
run  = "plugin kdeconnect-send"
desc = "Send selected files via KDE Connect"

# Ouch: compress selected files
[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress selected files"

# DuckDB: horizontal column navigation
[[mgr.prepend_keymap]]
on = "<C-h>"
run = "plugin duckdb -1"
desc = "DuckDB: previous column"

[[mgr.prepend_keymap]]
on = "<C-l>"
run = "plugin duckdb +1"
desc = "DuckDB: next column"

# DuckDB: open database
[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "plugin duckdb -open"
desc = "Open with DuckDB"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -ui"
desc = "Open DuckDB UI"
