# max_height      = 900
# image_delay     = 30
# image_quality   = 75
# [[manager.prepend_keymap]]
# on   = "T"
# run  = "plugin --sync hide-preview"
# desc = "Hide or show preview"
#
[mgr]
ratio = [ 1, 4, 3 ] # [parent, current, preview]

# [preview]
# wrap = "yes"
# tab_size = 2
# max_width = 1000
# max_height = 1600

# Archive preview
[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run = "ouch"

# Audio metadata and cover art
[[plugin.prepend_previewers]]
mime = "audio/*"
run = "exifaudio"

# CSV, TSV, JSON and data files
[[plugin.prepend_previewers]]
url = "*.csv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.tsv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.json"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.parquet"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.xlsx"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.duckdb"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.db"
run = "duckdb"

# Git status
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
